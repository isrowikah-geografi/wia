        // Quiz state tracking
        let quizAnswers = { q1: null, q2: null, q3: null, q4: null, q5: null };
        let caseStudyChoice = null;
        let currentSlide = 1;
        const totalSlides = 32;

        function updateSlideIndicator() {
            document.getElementById('slide-indicator').innerText = `Slide ${currentSlide} dari ${totalSlides}`;
            document.getElementById('btn-prev').disabled = currentSlide === 1;
            document.getElementById('btn-prev').classList.toggle('opacity-50', currentSlide === 1);
            document.getElementById('btn-next').disabled = currentSlide === totalSlides;
            document.getElementById('btn-next').classList.toggle('opacity-50', currentSlide === totalSlides);
        }

        function goToSlide(slideNum) {
            if (slideNum < 1 || slideNum > totalSlides) return;
            currentSlide = slideNum;
            renderSlide(currentSlide);
            updateSlideIndicator();
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                renderSlide(currentSlide);
                updateSlideIndicator();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                renderSlide(currentSlide);
                updateSlideIndicator();
            }
        }

        function answerQuiz(qNum, optionIndex, correctIndex) {
            quizAnswers['q' + qNum] = { selected: optionIndex, correct: correctIndex === optionIndex };
            // Re-render current quiz slide to show feedback
            renderSlide(currentSlide);
        }

        function chooseCaseStudy(choice) {
            caseStudyChoice = choice;
            renderSlide(29); // Go to evaluation/consequence slide
        }
    </script>

                        <div class="max-w-4xl mx-auto w-full h-full flex flex-col justify-center animate-fade">
                            <span class="text-xs font-bold text-olive-700 uppercase tracking-wider mb-1">Intisari Pembelajaran</span>
                            <h2 class="serif-font text-3xl font-bold text-gray-900 mb-6">Ringkasan Materi Lengkap</h2>
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div class="bg-white p-5 rounded-xl border border-gray-200">
                                    <h4 class="font-bold text-gray-800 text-sm mb-1 text-olive-700">1. Efek Rumah Kaca</h4>
                                    <p class="text-xs text-gray-600">Proses alami yang menahan panas bumi, namun berlebih akibat emisi gas antropogenik.</p>
                                </div>
                                <div class="bg-white p-5 rounded-xl border border-gray-200">
                                    <h4 class="font-bold text-gray-800 text-sm mb-1 text-olive-700">2. Siklus Karbon</h4>
                                    <p class="text-xs text-gray-600">Aliran karbon antar biosfer, lautan, dan litosfer yang terganggu oleh pembakaran bahan bakar fosil.</p>
                                </div>
                                <div class="bg-white p-5 rounded-xl border border-gray-200">
                                    <h4 class="font-bold text-gray-800 text-sm mb-1 text-olive-700">3. Aksi Nyata</h4>
                                    <p class="text-xs text-gray-600">Mitigasi melalui efisiensi energi, biopori, pengelolaan sampah, dan penghijauan di sekolah.</p>
                                </div>
                            </div>

                            <div class="flex justify-end">
                                <button onclick="goToSlide(32)" class="bg-olive-700 hover:bg-olive-800 text-white font-bold text-xs px-6 py-2.5 rounded-lg shadow transition">Menuju Penutup &rarr;</button>
                            </div>
                        </div>
                    `;
                    break;

                // ----------------------------------------------------
                // SLIDE 32: Penutup & Terima Kasih
                // ----------------------------------------------------
                case 32:
                    content = `
                        <div class="max-w-4xl mx-auto w-full h-full flex flex-col justify-center items-center text-center animate-fade">
                            <div class="w-20 h-20 bg-olive-700 text-white rounded-full flex items-center justify-center text-3xl mb-4 font-bold shadow-md">
                                🌱
                            </div>
                            <h2 class="serif-font text-4xl font-bold text-gray-900 mb-3">Terima Kasih!</h2>
                            <p class="text-gray-600 text-sm max-w-xl mb-6">"Bumi bukanlah warisan dari nenek moyang kita, melainkan pinjaman dari anak cucu kita." Mari jaga iklim bumi mulai dari langkah kecil di sekolah.</p>
                            
                            <div class="flex space-x-4">
                                <button onclick="goToSlide(1)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-6 py-3 rounded-xl text-xs transition">Kembali ke Slide 1</button>
                                <button onclick="goToSlide(2)" class="bg-olive-700 hover:bg-olive-800 text-white font-bold px-6 py-3 rounded-xl text-xs shadow transition">Buka Menu Utama</button>
                            </div>
                        </div>
                    `;
                    break;
            }

            viewport.innerHTML = content;
        }

        // Helper to generate quiz option HTML
        function generateOptionHTML(qNum, optIdx, text, ansState, isCorrect = false) {
            let isSelected = ansState !== null && ansState.selected === optIdx;
            let btnClass = "w-full text-left p-4 rounded-xl border text-xs transition flex items-center justify-between ";
            
            if (ansState === null) {
                btnClass += "bg-white border-gray-200 hover:border-olive-600 hover:bg-olive-50/50 text-gray-800 font-medium";
            } else {
                if (isCorrect) {
                    btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                } else if (isSelected && !isCorrect) {
                    btnClass += "bg-red-50 border-red-400 text-red-900 font-medium";
                } else {
                    btnClass += "bg-white border-gray-200 text-gray-400 opacity-60";
                }
            }

            return `
                <button onclick="answerQuiz(${qNum}, ${optIdx}, ${isCorrect ? optIdx : (optIdx === 0 ? 1 : 0)})" class="${btnClass}">
                    <span>${text}</span>
                    <span class="font-bold">${ansState !== null ? (isCorrect ? '✓ Benar' : (isSelected ? '✗ Pilihan Anda' : '')) : '&rarr;'}</span>
                </button>
            `;
        }

        // Helper to generate feedback box
        function renderFeedbackBox(isCorrect, nextSlideNum) {
            return `
                <div class="p-4 rounded-xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-amber-50 border border-amber-200 text-amber-900'} flex justify-between items-center animate-fade">
                    <div>
                        <p class="font-bold text-xs mb-0.5">${isCorrect ? '🎉 Jawaban Anda Benar!' : '💡 Kurang Tepat, Silakan Pelajari Kembali'}</p>
                        <p class="text-[11px] opacity-90">${isCorrect ? 'Pertahankan pemahaman konseptual geografi Anda.' : 'Perhatikan kembali penjelasan materi efek rumah kaca & siklus karbon.'}</p>
                    </div>
                    <button onclick="goToSlide(${nextSlideNum})" class="bg-gray-900 hover:bg-black text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition shrink-0 ml-4">Soal Berikutnya &rarr;</button>
                </div>
            `;
        }

        // Initial load on window startup
        window.onload = function() {
            goToSlide(1);
        };
    </script>

</body>
</html>
